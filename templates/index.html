{{define "content"}}
<header class="o-top">
    <a class="o-brand" href="/">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="6" fill="#2743C7"/><path d="M7 9.5 13 6l6 3.5v7L13 20l-6-3.5v-7Z" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 9.5 13 13l6-3.5M13 13v7" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/></svg>
        JFrog Manager
    </a>
    <div class="o-repo">
        <label for="repo-select">Repository</label>
        <span hx-get="/repos?default={{urlEncode .DefaultRepo}}" hx-trigger="load" hx-target="#repo-select" hx-swap="innerHTML"></span>
        <select id="repo-select" class="o-repo-select" name="repo">
            <option value="">Loading repositories...</option>
        </select>
    </div>
    <nav class="o-tabs" aria-label="Sections">
        <button type="button" id="tab-artifacts" class="o-tab" aria-current="page"
                hx-get="/artifacts" hx-target="#artifact-list" hx-include="#repo-select">
            <span class="htmx-indicator"><span class="o-spinner"></span></span>
            Artifacts
        </button>
        <button type="button" id="tab-vulnerabilities" class="o-tab"
                hx-get="/vulnerabilities" hx-target="#artifact-list" hx-include="#repo-select"
                title="Vulnerabilities in the latest version of each package">
            <span class="htmx-indicator"><span class="o-spinner"></span></span>
            Vulnerabilities
        </button>
    </nav>
</header>

<main class="o-main">
    <div id="error-container"></div>

    <section id="upload-section" aria-label="Upload">
        {{template "upload_form" .}}
    </section>

    <div id="artifact-list">
        <div class="o-card">
            <div class="o-empty">Select a repository to list its artifacts.</div>
        </div>
    </div>
</main>
{{end}}
