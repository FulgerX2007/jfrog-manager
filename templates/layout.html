{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFrog Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script>
        document.addEventListener("htmx:beforeSwap", function(evt) {
            var status = evt.detail.xhr.status;
            if (status === 422 || status === 413) {
                evt.detail.shouldSwap = true;
                evt.detail.isError = false;
            }
        });
    </script>
    <style>
        :root {
            --ground: #F3F4F6;
            --surface: #FFFFFF;
            --line: #E1E4EA;
            --line-soft: #EEF0F3;
            --line-strong: #C5CAD3;
            --ink: #14181F;
            --ink-2: #3A4250;
            --muted: #5A6270;
            --accent: #2743C7;
            --accent-dark: #1B2F8F;
            --accent-light: #E8ECFB;
            --critical: #A61B1B;
            --high: #B4470E;
            --medium: #F5D25A;
            --medium-ink: #3A2E00;
            --low: #D6E4FB;
            --low-ink: #173B7A;
            --unknown: #E1E4EA;
            --unknown-ink: #2B313B;
            --error: #A61B1B;
            --error-light: #FBE9E7;
            --success: #1F6B45;
            --success-light: #E4F2EA;
            --warning: #B98900;
            --warning-light: #FFF6DB;
            --font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }

        body {
            font-family: var(--font-family);
            font-size: 14px;
            line-height: 1.45;
            background-color: var(--ground);
            color: var(--ink);
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }
        h1, h2 { margin: 0; }
        a { color: var(--accent); }
        a:hover { color: var(--accent-dark); }
        button, input, select { font: inherit; }
        code { font-family: var(--font-mono); font-size: 0.75rem; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* ── Top bar ── */
        .o-top {
            background: var(--ink);
            color: var(--surface);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 24px;
            padding: 12px 32px;
        }
        .o-top :focus-visible { outline-color: var(--surface); }
        .o-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--surface);
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
        }
        .o-brand:hover { color: var(--surface); }
        .o-repo { display: flex; align-items: center; gap: 8px; flex: 1 1 320px; min-width: 0; }
        .o-repo label { font-size: 12px; color: #B9C0CC; text-transform: uppercase; letter-spacing: 0.06em; }
        .o-repo-select {
            flex: 1 1 auto;
            min-width: 0;
            max-width: 420px;
            height: 44px;
            padding: 0 12px;
            border-radius: 8px;
            border: 1px solid var(--ink-2);
            background: #1F2530;
            color: var(--surface);
            font-family: var(--font-mono);
            font-size: 13px;
        }
        .o-tabs { display: flex; gap: 4px; }
        .o-tab {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 44px;
            padding: 0 16px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--surface);
            font-weight: 600;
            cursor: pointer;
        }
        .o-tab:hover { background: #1F2530; }
        .o-tab[aria-current="page"] { background: var(--surface); color: var(--ink); }

        /* ── Page ── */
        .o-main {
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px 32px 48px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .o-layout { display: flex; flex-wrap: wrap; gap: 24px; }
        .o-side { flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .o-side-title, .o-eyebrow {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .o-side-title { margin-bottom: 6px; }
        .o-side-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 12px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--ink);
            cursor: pointer;
            text-align: left;
        }
        .o-side-btn:hover { background: var(--line); }
        .o-side-btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); font-weight: 600; }
        .o-count { font-family: var(--font-mono); font-size: 12px; }
        .o-content { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
        .o-report { display: flex; flex-direction: column; gap: 16px; max-width: 1280px; margin: 0 auto; width: 100%; }
        .o-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
        .o-head h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
        .o-sub { color: var(--muted); margin-top: 2px; }
        .o-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
        .o-toolbar .o-input { flex: 1 1 260px; }

        .o-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px;
        }
        .o-card-title { font-size: 16px; font-weight: 700; }
        .o-card-title span { font-weight: 500; color: var(--muted); }

        /* ── Segmented control ── */
        .o-seg { display: inline-flex; background: var(--line); border-radius: 10px; padding: 3px; }
        .o-seg-btn {
            min-height: 40px;
            padding: 0 14px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--ink-2);
            cursor: pointer;
        }
        .o-seg-btn[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; }

        /* ── Form controls ── */
        .o-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
        .o-field-grow { flex: 1 1 200px; }
        .o-label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
        .o-select, .o-input {
            height: 44px;
            width: 100%;
            padding: 0 12px;
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            background: var(--surface);
            color: var(--ink);
        }
        input[type="file"].o-input { padding: 9px 12px; }

        .o-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 16px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
        }
        .o-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .o-btn-primary { background: var(--accent); color: var(--surface); }
        .o-btn-primary:hover:not(:disabled) { background: var(--accent-dark); color: var(--surface); }
        .o-btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
        .o-btn-secondary:hover:not(:disabled) { background: var(--ground); color: var(--ink); }
        .o-btn-danger { background: var(--error); color: var(--surface); }
        .o-btn-danger:hover:not(:disabled) { background: #7A1515; }
        .o-btn-ghost { background: transparent; color: var(--ink); }
        .o-btn-ghost:hover:not(:disabled) { background: var(--ground); color: var(--ink); }
        .o-btn-sm { min-height: 40px; padding: 0 12px; }
        .o-btn-icon { width: 44px; padding: 0; }
        .o-btn-delete { color: var(--error); }
        .o-btn-delete:hover:not(:disabled) { color: var(--error); background: var(--error-light); }
        .o-btn[data-open="true"] { background: var(--ink); color: var(--surface); }
        .o-link {
            border: 0;
            background: none;
            padding: 0;
            min-height: 24px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }

        /* ── Upload ── */
        .o-upload-card {
            background: var(--surface);
            border: 1.5px dashed #9AA3B2;
            border-radius: 12px;
            padding: 16px 20px;
        }
        .o-upload-card.o-drag { border-color: var(--accent); background: var(--accent-light); }
        .o-upload-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; }
        .o-upload-intro { flex: 1 1 200px; min-width: 0; }
        .o-upload-intro strong { display: block; }
        .o-upload-intro span { color: var(--muted); font-size: 13px; }
        .o-progress-track { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
        .o-progress-fill { height: 100%; background: var(--accent); transition: width 0.15s ease; }
        .o-progress-fill.o-progress-done { background: var(--success); }
        .o-progress-fill.o-progress-error { background: var(--error); }

        /* ── Tables ── */
        .o-table-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
        .o-table-wrap { overflow-x: auto; }
        .o-table { width: 100%; min-width: 760px; border-collapse: collapse; }
        .o-table thead th {
            text-align: left;
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #F8F9FB;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }
        .o-table tbody td { padding: 10px 12px; border-top: 1px solid var(--line-soft); vertical-align: top; }
        .o-table thead th:first-child, .o-table tbody td:first-child { padding-left: 16px; }
        .o-table thead th:last-child, .o-table tbody td:last-child { padding-right: 16px; }
        .o-table .col-checkbox { width: 34px; }
        .o-table .col-actions { text-align: right; white-space: nowrap; padding-top: 6px; padding-bottom: 6px; }
        .o-table .col-actions > * { vertical-align: middle; }
        .o-pkg { font-weight: 600; }
        .o-ver { font-family: var(--font-mono); font-weight: 500; font-size: 13px; color: var(--ink-2); }
        .o-path, .o-mono { font-family: var(--font-mono); font-size: 12px; color: var(--muted); word-break: break-all; }
        .o-num { font-variant-numeric: tabular-nums; white-space: nowrap; }
        .o-muted { color: var(--muted); font-size: 13px; }
        .o-tag {
            background: var(--ink);
            color: var(--surface);
            border-radius: 6px;
            padding: 1px 8px;
            font-size: 12px;
            font-weight: 600;
        }
        .o-check { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--accent); }

        .o-bulk-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--error-light);
            border: 1px solid #E3A9A2;
            border-radius: 8px;
            padding: 2px 2px 2px 14px;
            color: #7A1515;
            font-weight: 600;
        }
        .o-bulk-bar .o-link { color: #7A1515; font-size: 14px; }

        /* ── Badges ── */
        .o-badges { display: flex; flex-wrap: wrap; gap: 4px; }
        .o-badge {
            display: inline-block;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            background: var(--unknown);
            color: var(--unknown-ink);
        }
        .o-badge-critical { background: var(--critical); color: var(--surface); }
        .o-badge-high { background: var(--high); color: var(--surface); }
        .o-badge-medium { background: var(--medium); color: var(--medium-ink); }
        .o-badge-low { background: var(--low); color: var(--low-ink); }

        /* ── Alerts ── */
        .o-alert {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--line);
        }
        .o-alert > svg { flex: none; margin-top: 2px; }
        .o-alert-danger { background: var(--error-light); border-color: #E3A9A2; color: #7A1515; }
        .o-alert-info { background: var(--accent-light); border-color: #B9C4F0; color: var(--accent-dark); }
        .o-alert-muted { background: var(--ground); color: var(--muted); }
        .o-alert-warning { background: var(--warning-light); border-color: #E2C766; color: var(--medium-ink); }
        .o-alert-warning summary { cursor: pointer; font-weight: 600; }
        .o-alert-close {
            margin-left: auto;
            border: 0;
            background: none;
            color: inherit;
            font-size: 20px;
            line-height: 1;
            min-width: 28px;
            min-height: 28px;
            cursor: pointer;
        }
        .o-not-scanned { margin: 8px 0 0; padding-left: 20px; font-size: 13px; }

        .o-empty { padding: 40px 16px; text-align: center; color: var(--muted); }

        /* ── Spinner ── */
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { display: inline-flex; }
        .o-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: o-spin 0.7s linear infinite;
        }
        @keyframes o-spin { to { transform: rotate(360deg); } }

        /* ── Findings (Xray panel and report) ── */
        .o-xray-panel > td { padding: 0 !important; border-top: 0 !important; }
        .o-xray-inner { padding: 14px 16px; background: #F8F9FB; border-top: 1px solid var(--line-soft); }
        .o-xray-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
        .o-xray-skeleton { display: flex; flex-direction: column; gap: 10px; }
        .o-skel-row { display: flex; align-items: center; gap: 10px; }
        .o-skel-bar, .o-skel-pill { height: 12px; border-radius: 6px; background: var(--line); animation: o-pulse 1.2s ease-in-out infinite; }
        .o-skel-pill { width: 64px; height: 18px; }
        @keyframes o-pulse { 50% { opacity: 0.45; } }
        .o-findings { width: 100%; min-width: 720px; border-collapse: collapse; background: var(--surface); }
        .o-findings th {
            text-align: left;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #F8F9FB;
        }
        .o-findings td { padding: 12px; border-top: 1px solid var(--line-soft); vertical-align: top; }
        .o-findings th:first-child, .o-findings td:first-child { padding-left: 16px; }
        .o-findings th:last-child, .o-findings td:last-child { padding-right: 16px; }
        .o-findings .col-sev { width: 100px; }
        .o-findings .col-id { width: 150px; }
        .o-findings .col-pkg { width: 150px; }
        .o-findings .col-src { width: 36%; }
        .o-finding-ids code { display: block; white-space: nowrap; }
        .o-impact { display: block; font-weight: 500; color: var(--ink); word-break: break-all; }
        .o-impact + .o-impact, details .o-impact { margin-top: 4px; color: var(--ink-2); font-weight: 400; }
        .o-more { margin-top: 4px; }
        .o-more summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--accent); }
        .o-ok { color: var(--success); font-weight: 600; }

        /* ── Vulnerability report ── */
        .o-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
        .o-tile {
            text-align: left;
            min-height: 72px;
            padding: 10px 14px;
            border: 2px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
            color: var(--ink);
            cursor: pointer;
        }
        .o-tile:disabled { cursor: default; color: var(--muted); }
        .o-tile[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
        .o-tile-count { display: block; font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
        .o-tile-label { font-size: 13px; font-weight: 600; }
        .o-bar { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 14px; }
        .o-bar > div { flex-basis: 0; }
        .o-bar-critical { background: var(--critical); }
        .o-bar-high { background: var(--high); }
        .o-bar-medium { background: var(--medium); }
        .o-bar-low { background: #8FB3F0; }
        .o-bar-unknown { background: #9AA3B2; }
        .o-group { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
        .o-group > summary {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
            min-height: 60px;
            padding: 10px 16px;
            cursor: pointer;
            list-style: none;
        }
        .o-group > summary::-webkit-details-marker { display: none; }
        .o-group > summary::after { content: "Show"; font-weight: 600; color: var(--accent); }
        .o-group[open] > summary::after { content: "Hide"; }
        .o-group[open] > summary { border-bottom: 1px solid var(--line); }
        .o-group-name { font-size: 17px; font-weight: 700; min-width: 96px; }
        .o-group-files { flex: 1 1 220px; min-width: 0; }
        .o-clean-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .o-clean {
            background: var(--success-light);
            color: #154A30;
            border-radius: 6px;
            padding: 4px 10px;
            font-family: var(--font-mono);
            font-size: 12px;
        }

        @media (max-width: 640px) {
            .o-top { padding: 12px 16px; }
            .o-main { padding: 16px 16px 32px; }
        }
    </style>
</head>
<body>
    {{template "content" .}}
    <script>
        // Sync upload form repo with dropdown selection
        function syncUploadRepo() {
            var repoSelect = document.getElementById('repo-select');
            var uploadRepo = document.getElementById('upload-repo');
            if (repoSelect && uploadRepo) {
                uploadRepo.value = repoSelect.value;
            }
        }
        // Restore last used folder from localStorage
        function restoreFolder() {
            var folderInput = document.getElementById('upload-folder');
            if (folderInput) {
                var saved = localStorage.getItem('jfrog-last-folder');
                if (saved) folderInput.value = saved;
            }
        }
        // Save folder to localStorage on change
        document.addEventListener('input', function(e) {
            if (e.target && e.target.id === 'upload-folder') {
                localStorage.setItem('jfrog-last-folder', e.target.value);
            }
        });
        document.addEventListener('change', function(e) {
            if (e.target && e.target.id === 'repo-select') {
                syncUploadRepo();
            }
        });
        document.addEventListener('htmx:afterSettle', function() {
            syncUploadRepo();
            restoreFolder();
        });

        // Checkbox management
        function toggleAll(source) {
            var checkboxes = document.querySelectorAll('.artifact-checkbox');
            checkboxes.forEach(function(cb) { cb.checked = source.checked; });
            updateSelectedCount();
        }

        function updateSelectedCount() {
            var checked = document.querySelectorAll('.artifact-checkbox:checked');
            var countEl = document.getElementById('selected-count');
            var btn = document.getElementById('bulk-delete-btn');
            if (countEl) countEl.textContent = checked.length;
            if (btn) btn.disabled = checked.length === 0;
            var bar = document.getElementById('bulk-bar');
            if (bar) bar.hidden = checked.length === 0;

            var all = document.querySelectorAll('.artifact-checkbox');
            var selectAll = document.getElementById('select-all');
            if (selectAll && all.length > 0) {
                selectAll.checked = checked.length === all.length;
                selectAll.indeterminate = checked.length > 0 && checked.length < all.length;
            }
        }

        function clearSelection() {
            document.querySelectorAll('.artifact-checkbox').forEach(function(cb) { cb.checked = false; });
            updateSelectedCount();
        }

        // Hide the rows whose path does not contain the typed text
        function filterArtifacts(value) {
            var q = value.trim().toLowerCase();
            document.querySelectorAll('.o-row-group').forEach(function(group) {
                group.hidden = q !== '' && group.getAttribute('data-filter').indexOf(q) < 0;
            });
        }

        function bulkDelete() {
            var checked = document.querySelectorAll('.artifact-checkbox:checked');
            if (checked.length === 0) return;

            if (!confirm('Delete ' + checked.length + ' artifact(s)?')) return;

            var paths = [];
            checked.forEach(function(cb) { paths.push(cb.value); });

            var repo = document.getElementById('repo-select').value;

            fetch('/artifacts/bulk-delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({repo: repo, paths: paths})
            }).then(function(resp) {
                return resp.text().then(function(html) {
                    if (resp.ok) {
                        document.getElementById('artifact-list').innerHTML = html;
                        htmx.process(document.getElementById('artifact-list'));
                    } else {
                        document.getElementById('error-container').innerHTML = html;
                    }
                });
            });
        }

        // Xray toggle — first click fetches+shows (with skeleton),
        // second click collapses. Button gets data-open="true" while panel shown.
        var XRAY_SKELETON = ''
            + '<td colspan="6"><div class="o-xray-inner"><div class="o-xray-skeleton">'
            +   '<div class="o-skel-row"><div class="o-skel-pill"></div><div class="o-skel-bar" style="flex:1;max-width:60%"></div></div>'
            +   '<div class="o-skel-row"><div class="o-skel-pill"></div><div class="o-skel-bar" style="flex:1;max-width:45%"></div></div>'
            +   '<div class="o-skel-row"><div class="o-skel-pill"></div><div class="o-skel-bar" style="flex:1;max-width:70%"></div></div>'
            + '</div></div></td>';

        function toggleXray(btn) {
            var panelId = btn.getAttribute('data-panel-id');
            var panel = document.getElementById(panelId);
            if (!panel) return;
            if (panel.innerHTML.trim() !== '') {
                panel.innerHTML = '';
                btn.removeAttribute('data-open');
                return;
            }
            btn.setAttribute('data-open', 'true');
            panel.innerHTML = XRAY_SKELETON;
            var repo = btn.getAttribute('data-repo');
            var path = btn.getAttribute('data-path');
            var url = '/xray?repo=' + encodeURIComponent(repo) + '&path=' + encodeURIComponent(path);
            fetch(url).then(function(resp) {
                return resp.text().then(function(html) {
                    if (resp.ok) {
                        panel.innerHTML = html;
                    } else {
                        panel.innerHTML = '';
                        btn.removeAttribute('data-open');
                        document.getElementById('error-container').innerHTML = html;
                    }
                });
            }).catch(function() {
                panel.innerHTML = '';
                btn.removeAttribute('data-open');
            });
        }

        // Upload with progress bar
        function uploadWithProgress(e) {
            e.preventDefault();
            var form = document.getElementById('upload-form');
            var btn = document.getElementById('upload-btn');
            var progressWrap = document.getElementById('upload-progress');
            var progressBar = document.getElementById('upload-progress-bar');
            var progressText = document.getElementById('upload-progress-text');

            var formData = new FormData(form);

            btn.disabled = true;
            progressWrap.style.display = 'block';
            progressBar.style.width = '0%';
            progressBar.className = 'o-progress-fill';
            progressText.textContent = '0%';

            var xhr = new XMLHttpRequest();

            xhr.upload.addEventListener('progress', function(evt) {
                if (evt.lengthComputable) {
                    var pct = Math.round((evt.loaded / evt.total) * 100);
                    progressBar.style.width = pct + '%';
                    progressText.textContent = pct + '%';
                }
            });

            xhr.addEventListener('load', function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    progressBar.style.width = '100%';
                    progressBar.classList.add('o-progress-done');
                    progressText.textContent = 'Done';
                    document.getElementById('artifact-list').innerHTML = xhr.responseText;
                    htmx.process(document.getElementById('artifact-list'));
                    form.reset();
                    restoreFolder();
                    setTimeout(function() {
                        progressWrap.style.display = 'none';
                    }, 1500);
                } else {
                    progressBar.style.width = '100%';
                    progressBar.classList.add('o-progress-error');
                    progressText.textContent = 'Error';
                    document.getElementById('error-container').innerHTML = xhr.responseText;
                    setTimeout(function() {
                        progressWrap.style.display = 'none';
                    }, 3000);
                }
                btn.disabled = false;
            });

            xhr.addEventListener('error', function() {
                progressBar.style.width = '100%';
                progressBar.classList.add('o-progress-error');
                progressText.textContent = 'Error';
                btn.disabled = false;
                setTimeout(function() {
                    progressWrap.style.display = 'none';
                }, 3000);
            });

            xhr.open('POST', '/artifacts/upload');
            xhr.send(formData);
        }

        // Dismiss alert
        function dismissAlert(el) {
            el.closest('.o-alert').remove();
        }

        // Tabs: mark the active section and show the upload area only with the artifact list
        function activeTab() {
            return document.querySelector('.o-tab[aria-current="page"]');
        }
        document.addEventListener('click', function(e) {
            var tab = e.target.closest ? e.target.closest('.o-tab') : null;
            if (!tab) return;
            document.querySelectorAll('.o-tab').forEach(function(t) { t.removeAttribute('aria-current'); });
            tab.setAttribute('aria-current', 'page');
            var upload = document.getElementById('upload-section');
            if (upload) upload.hidden = tab.id !== 'tab-artifacts';
        });
        // Load the active section when the repository list arrives or the repository changes
        function loadActiveTab() {
            var repoSelect = document.getElementById('repo-select');
            var tab = activeTab();
            if (tab && repoSelect && repoSelect.value) htmx.trigger(tab, 'click');
        }
        document.addEventListener('htmx:afterSwap', function(e) {
            if (!e.detail.target) return;
            if (e.detail.target.id === 'repo-select') loadActiveTab();
            // A fresh list or report replaces any earlier error message
            if (e.detail.target.id === 'artifact-list') document.getElementById('error-container').innerHTML = '';
        });
        // Nothing to load until the repository list has arrived
        document.addEventListener('htmx:beforeRequest', function(e) {
            var el = e.detail.elt;
            var repoSelect = document.getElementById('repo-select');
            if (el && el.classList && el.classList.contains('o-tab') && repoSelect && !repoSelect.value) e.preventDefault();
        });
        document.addEventListener('change', function(e) {
            if (e.target && e.target.id === 'repo-select') loadActiveTab();
        });

        // Drag a file onto the upload area to select it
        document.addEventListener('dragover', function(e) {
            var zone = e.target.closest ? e.target.closest('.o-upload-card') : null;
            if (!zone) return;
            e.preventDefault();
            zone.classList.add('o-drag');
        });
        document.addEventListener('dragleave', function(e) {
            var zone = e.target.closest ? e.target.closest('.o-upload-card') : null;
            if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('o-drag');
        });
        document.addEventListener('drop', function(e) {
            var zone = e.target.closest ? e.target.closest('.o-upload-card') : null;
            if (!zone) return;
            e.preventDefault();
            zone.classList.remove('o-drag');
            var input = document.getElementById('upload-file');
            if (input && e.dataTransfer && e.dataTransfer.files.length > 0) input.files = e.dataTransfer.files;
        });
    </script>
</body>
</html>
{{end}}
