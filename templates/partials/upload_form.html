{{define "upload_form"}}
<div class="card card-body">
    <form hx-post="/artifacts/upload" hx-encoding="multipart/form-data"
          hx-target="#artifact-list" hx-on::after-request="if(event.detail.successful) this.reset()">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label for="upload-repo" class="form-label">Repository</label>
                <input type="text" class="form-control" id="upload-repo" name="repo" required
                       placeholder="e.g. libs-release-local">
            </div>
            <div class="col-md-4">
                <label for="upload-path" class="form-label">Path</label>
                <input type="text" class="form-control" id="upload-path" name="path" required
                       placeholder="e.g. com/example/artifact.jar">
            </div>
            <div class="col-md-3">
                <label for="upload-file" class="form-label">File</label>
                <input type="file" class="form-control" id="upload-file" name="file" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success w-100">Upload</button>
            </div>
        </div>
    </form>
</div>
{{end}}
