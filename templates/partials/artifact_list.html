{{define "artifact_list"}}
{{if .Artifacts}}
<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>Name</th>
            <th>Path</th>
            <th>Size</th>
            <th>Last Modified</th>
            <th>Actions</th>
        </tr>
    </thead>
        {{range .Artifacts}}
        <tbody id="artifact-group-{{cssID .Path}}">
        <tr>
            <td>{{.Name}}</td>
            <td>{{.Path}}</td>
            <td>{{.Size}}</td>
            <td>{{.LastModified}}</td>
            <td>
                <button class="btn btn-sm btn-info"
                        hx-get="/xray?repo={{urlEncode .Repo}}&path={{urlEncode .Path}}"
                        hx-target="#xray-panel-{{cssID .Path}}"
                        hx-swap="innerHTML">
                    Xray
                </button>
                <button class="btn btn-sm btn-danger"
                        hx-delete="/artifacts?repo={{urlEncode .Repo}}&path={{urlEncode .Path}}"
                        hx-confirm="Delete {{.Name}}?"
                        hx-target="#artifact-group-{{cssID .Path}}"
                        hx-swap="outerHTML">
                    Delete
                </button>
            </td>
        </tr>
        <tr id="xray-panel-{{cssID .Path}}" class="xray-panel"></tr>
        </tbody>
        {{end}}
</table>
{{else}}
<p class="text-muted">No artifacts found in this repository.</p>
{{end}}
{{end}}
