{{define "artifact_list"}}
{{if .Artifacts}}
<div class="o-card" style="padding-bottom:0">
    <div class="o-bulk-bar">
        <button id="bulk-delete-btn" class="o-btn o-btn-danger o-btn-sm" disabled onclick="bulkDelete()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            Delete Selected (<span id="selected-count">0</span>)
        </button>
    </div>
    <div class="o-table-wrap">
        <table class="o-table">
            <thead>
                <tr>
                    <th class="col-checkbox"><input type="checkbox" class="o-check" id="select-all" onchange="toggleAll(this)"></th>
                    <th>Name</th>
                    <th>Path</th>
                    <th>Size</th>
                    <th>Last Modified</th>
                    <th class="col-actions">Actions</th>
                </tr>
            </thead>
            {{range .Artifacts}}
            <tbody id="artifact-group-{{cssID .Path}}">
            <tr>
                <td><input type="checkbox" class="o-check artifact-checkbox" value="{{.Path}}" onchange="updateSelectedCount()"></td>
                <td style="font-weight:600">{{.Name}}</td>
                <td style="color:var(--grey-500);font-size:0.8125rem">{{.Path}}</td>
                <td>{{.Size}}</td>
                <td style="font-size:0.8125rem">{{.LastModified}}</td>
                <td class="col-actions">
                    <button class="o-btn o-btn-ghost o-btn-sm"
                            hx-get="/xray?repo={{urlEncode .Repo}}&path={{urlEncode .Path}}"
                            hx-target="#xray-panel-{{cssID .Path}}"
                            hx-swap="innerHTML"
                            title="Scan with Xray">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                        Xray
                    </button>
                    <button class="o-btn o-btn-ghost o-btn-sm" style="color:var(--error)"
                            hx-delete="/artifacts?repo={{urlEncode .Repo}}&path={{urlEncode .Path}}"
                            hx-confirm="Delete {{.Name}}?"
                            hx-target="#artifact-group-{{cssID .Path}}"
                            hx-swap="outerHTML"
                            title="Delete artifact">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                    </button>
                </td>
            </tr>
            <tr id="xray-panel-{{cssID .Path}}" class="o-xray-panel"></tr>
            </tbody>
            {{end}}
        </table>
    </div>
</div>
{{else}}
<div class="o-card">
    <div class="o-empty">
        <div class="o-empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        </div>
        <div class="o-empty-text">No artifacts found in this repository.</div>
    </div>
</div>
{{end}}
{{end}}
